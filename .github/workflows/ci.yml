name: TalentFlow CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore TalentFlow.sln

    - name: Build solution
      run: dotnet build TalentFlow.sln --configuration Release --no-restore --warnaserror

    - name: Run Unit & Integration Tests
      run: dotnet test TalentFlow.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Verify Code Coverage Gate (>= 50%)
      run: |
        python3 -c "
        import xml.etree.ElementTree as ET
        import glob, os, sys

        files = sorted(glob.glob('tests/TalentFlow.Application.Tests/TestResults/*/coverage.cobertura.xml'), key=os.path.getmtime, reverse=True)
        if not files:
            print('FAILED: Coverage report not found!')
            sys.exit(1)

        tree = ET.parse(files[0])
        found = False
        for pkg in tree.findall('.//package'):
            if 'TalentFlow.Application' in pkg.attrib.get('name', ''):
                rate = float(pkg.attrib.get('line-rate', '0'))
                print(f'TalentFlow.Application line coverage: {rate * 100:.2f}% (Threshold: 50%)')
                found = True
                if rate < 0.50:
                    print('FAILED: Coverage is below 50% threshold!')
                    sys.exit(1)
        if not found:
            print('FAILED: TalentFlow.Application package not found in coverage report!')
            sys.exit(1)
        print('PASSED: Code coverage gate satisfied.')
        "
