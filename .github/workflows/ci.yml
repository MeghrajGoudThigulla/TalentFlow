name: TalentFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore TalentFlow.sln

    - name: Build solution
      run: dotnet build TalentFlow.sln --configuration Release --no-restore --warnaserror

    - name: Run Unit & Integration Tests
      run: dotnet test TalentFlow.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
