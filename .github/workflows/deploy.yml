name: Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      service_url:
        description: 'Render service URL to smoke test (e.g. https://talentflow-api.onrender.com)'
        required: false
        default: 'https://talentflow-api.onrender.com'

jobs:
  deploy:
    name: Trigger Render Deploy & Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        id: trigger_deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping deploy hook trigger."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Triggering Render deployment via deploy hook..."
          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "Deploy hook successfully triggered (HTTP $HTTP_RESPONSE)."
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::Failed to trigger deploy hook. HTTP status: $HTTP_RESPONSE"
            exit 1
          fi

      - name: Await Service Availability & Run Smoke Tests
        if: steps.trigger_deploy.outputs.skipped != 'true'
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || inputs.service_url || 'https://talentflow-api.onrender.com' }}
        run: |
          echo "Running health check smoke tests against: $SERVICE_URL"
          MAX_RETRIES=20
          RETRY_INTERVAL=15
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: Checking $SERVICE_URL/health/ready..."
            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "$SERVICE_URL/health/ready" || true)
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              cat response.json
              echo ""
              echo "Smoke test passed! Application is ready and database is connected."
              SUCCESS=true
              break
            fi

            echo "Health check returned HTTP $HTTP_STATUS. Waiting ${RETRY_INTERVAL}s before retrying..."
            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error ::Smoke tests failed: $SERVICE_URL/health/ready was not ready within timeout."
            exit 1
          fi

          # Verify liveness endpoint as well
          echo "Verifying $SERVICE_URL/health/live..."
          LIVE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health/live")
          if [ "$LIVE_STATUS" -eq 200 ]; then
            echo "Liveness check passed (HTTP 200)."
          else
            echo "::error ::Liveness probe failed with HTTP $LIVE_STATUS"
            exit 1
          fi
