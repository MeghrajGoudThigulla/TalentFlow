services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: talentflow-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - talentflow-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: talentflow-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    restart: unless-stopped

  talentflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - UseSqlServer=true
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TalentFlowDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - EmailSettings__SmtpHost=mailhog
      - EmailSettings__SmtpPort=1025
      - EmailSettings__FromEmail=noreply@talentflow.local
      - EmailSettings__FromName=TalentFlow ATS
      - JwtSettings__Secret=TalentFlowDevSecretKey2026_RotatedSecureKey_RequiresAtLeast32BytesLength!
      - JwtSettings__Issuer=TalentFlowApi
      - JwtSettings__Audience=TalentFlowClient
    volumes:
      - talentflow-resumes:/app/uploads/resumes
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  talentflow-sql-data:
  talentflow-resumes:
